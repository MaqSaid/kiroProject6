networks:
  rag-network:
    driver: bridge

volumes:
  neo4j_data:
  chroma_data:
  doc_storage:

services:
  # =============================================================================
  # Layer 1: External Infrastructure Services
  # =============================================================================

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8000:8000"
    environment:
      - ANONYMIZED_TELEMETRY=false
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # Layer 2: Graph Service and Embedding Service (depend on infra only)
  # =============================================================================

  graph-service:
    build:
      context: ../../
      dockerfile: services/graph-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=graph-service
      - SERVICE_PORT=8003
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
    networks:
      - rag-network
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  embedding-service:
    build:
      context: ../../
      dockerfile: services/embedding-service/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=embedding-service
      - SERVICE_PORT=8004
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.titan-embed-text-v2:0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # Layer 3: Query Service and Ingestion Service (depend on Graph + Embedding)
  # =============================================================================

  query-service:
    build:
      context: ../../
      dockerfile: services/query-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=query-service
      - SERVICE_PORT=8001
      - GRAPH_SERVICE_URL=http://graph-service:8003
      - EMBEDDING_SERVICE_URL=http://embedding-service:8004
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
    networks:
      - rag-network
    depends_on:
      graph-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ingestion-service:
    build:
      context: ../../
      dockerfile: services/ingestion-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=ingestion-service
      - SERVICE_PORT=8002
      - GRAPH_SERVICE_URL=http://graph-service:8003
      - EMBEDDING_SERVICE_URL=http://embedding-service:8004
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
    volumes:
      - doc_storage:/app/data/documents
    networks:
      - rag-network
    depends_on:
      graph-service:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # =============================================================================
  # Layer 4: API Gateway (depends on all backend services)
  # =============================================================================

  gateway:
    build:
      context: ../../
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=gateway
      - SERVICE_PORT=8080
      - QUERY_SERVICE_URL=http://query-service:8001
      - INGESTION_SERVICE_URL=http://ingestion-service:8002
      - GRAPH_SERVICE_URL=http://graph-service:8003
      - EMBEDDING_SERVICE_URL=http://embedding-service:8004
      - API_KEYS=${API_KEYS:-dev-api-key}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
    networks:
      - rag-network
    depends_on:
      query-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
