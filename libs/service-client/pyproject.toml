[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legislation-rag-service-client"
version = "0.1.0"
description = "Shared httpx client with circuit breaker, retry, and correlation ID propagation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["service_client", "src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
