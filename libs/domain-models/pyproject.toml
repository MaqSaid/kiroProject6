[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legislation-rag-domain-models"
version = "0.1.0"
description = "Shared domain models for the Legislation RAG Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "mypy>=1.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_models"]
