[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legislation-rag-query-service"
version = "0.1.0"
description = "Query orchestration service for the Legislation RAG Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "strands-agents>=0.1.0",
    "chromadb>=0.4.22",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.3.0",
    "pydantic-settings>=2.1.0",
    "prometheus-client>=0.20.0",
    "legislation-rag-domain-models @ file:///${PROJECT_ROOT}/../../libs/domain-models",
    "legislation-rag-service-client @ file:///${PROJECT_ROOT}/../../libs/service-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
dev-mode = true

[tool.hatch.envs.default.env-vars]
PIP_EDITABLE_INSTALLS = "true"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
